<!DOCTYPE html>

<title>EuphorbiaQuest Field Database</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ec;--surface:#fff;--text:#1c261c;--muted:#68725f;--line:#d9d5c7;--accent:#3d6838;--accent-t:#fff;--danger:#b3392f;--warn:#fbf0d4;--warn-t:#6b4e00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141914;--surface:#1d241d;--text:#e8ece4;--muted:#9aa595;--line:#324030;--accent:#7fb877;--accent-t:#101810;--danger:#e0736a;--warn:#3a3217;--warn-t:#e6cf8a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141914;--surface:#1d241d;--text:#e8ece4;--muted:#9aa595;--line:#324030;--accent:#7fb877;--accent-t:#101810;--danger:#e0736a;--warn:#3a3217;--warn-t:#e6cf8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px 14px 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:21px;margin:0 0 10px}
h2{font-size:15px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea,button{font:inherit;font-size:17px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input,select,textarea{width:100%}
button{cursor:pointer}
button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.d{color:var(--danger)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .no{font-size:13px;font-weight:700;color:var(--accent)}
.card .tx{font-weight:600;font-style:italic}
.card .sub{font-size:14px;color:var(--muted)}
.banner{background:var(--warn);color:var(--warn-t);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.top{display:flex;gap:8px;margin:10px 0}.top input{flex:1}
.muted{color:var(--muted);font-size:14px}
.stack>*{margin-bottom:8px;width:100%}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:4px;overflow:hidden}.sug:empty{display:none}.sug div{padding:12px 14px;font-style:italic;border-bottom:1px solid var(--line);cursor:pointer}.sug div:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;line-height:1.2;padding:9px 2px;min-height:56px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700}
.cp{display:flex;gap:12px;align-items:center}.cp .cb{flex:1;min-width:0}.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line);flex:none;display:block}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:pointer;background:var(--line)}
#pv{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}#pv.on{display:flex}#pv img{flex:1;min-height:0;width:100%;object-fit:contain}
#pv .pvt,#pv .bar{display:flex;gap:6px;align-items:center;padding:10px;background:#000;color:#fff}#pv .pvt{padding-top:calc(10px + env(safe-area-inset-top,0px))}#pv .bar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#pv button{background:#222;color:#fff;border-color:#444;font-size:15px;padding:8px 6px}#pv .bar button{flex:1}#pv .pvt button{min-width:52px}#pv button:disabled{opacity:.35}#pv #pv_n{flex:1;text-align:center;font-size:14px;color:#ccc}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;padding:20px;align-items:center;justify-content:center}
#ov.on{display:flex}
#ovm{white-space:pre-line}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin-top:14px}.dl{padding:10px 0;border-bottom:1px solid var(--line)}.dl:last-child{border-bottom:0}.dk{font-size:13px;color:var(--muted)}.dv{font-size:17px}.dv.pre{white-space:pre-wrap}
.grp{margin-bottom:8px}.gh{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:54px;text-align:left}.gc{color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}.gb{margin:8px 0 4px 12px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);margin:-6px -14px 6px;padding:8px 14px}
.hdr button{min-height:40px;font-size:15px;padding:6px 14px}#topback{font-weight:600}
#ov .box{background:var(--bg);border-radius:14px;padding:18px;max-width:420px;width:100%}
</style>
</head>

<script>
(function(){
var DB,plants=[],lastBackup=null,tab="collection",q="",editing=null,msg="",lang="en",wishes=[],wq="",wedit=null,genera=[],gf="",fns=[],fq="",fmode="plant",fpre="",ftax=null,fedit=null,fdef={},notes=[],nq="",nedit=null,lastFull=null,pending=null,fview=null,csort="name",pview=null;
var ST=["Unknown","Confirmed"];
var TABS=[["collection","Collection"],["wishlist","Wishlist"],["fields","Field Numbers"],["notes","Notes"],["settings","Settings / Backup"]];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML.replace(/"/g,"&quot;")}
function opts(sel){return ST.map(function(s){return "<option value=\""+s+"\""+(s===sel?" selected":"")+">"+s+"</option>"}).join("")}

function openDB(){return new Promise(function(res,rej){var r=indexedDB.open("eq-field-db",6);
 r.onupgradeneeded=function(){var d=r.result;var n=d.objectStoreNames;if(!n.contains("plants"))d.createObjectStore("plants",{keyPath:"id"});if(!n.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});if(!n.contains("wishlist"))d.createObjectStore("wishlist",{keyPath:"id"});if(!n.contains("fieldnos"))d.createObjectStore("fieldnos",{keyPath:"id"});if(!n.contains("notes"))d.createObjectStore("notes",{keyPath:"id"});if(!n.contains("photos"))d.createObjectStore("photos",{keyPath:"id"});if(!n.contains("photofull"))d.createObjectStore("photofull",{keyPath:"id"})};
 r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function req(store,mode,fn){return new Promise(function(res,rej){var t=DB.transaction(store,mode),o=fn(t);t.oncomplete=function(){res(o&&o.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function getAll(){return req("plants","readonly",function(t){return t.objectStore("plants").getAll()})}
function getMeta(k){return req("meta","readonly",function(t){return t.objectStore("meta").get(k)}).then(function(r){return r?r.v:null})}
function setMeta(k,v){return req("meta","readwrite",function(t){t.objectStore("meta").put({k:k,v:v})})}
function savePlant(p,isNew){return new Promise(function(res,rej){
 var t=DB.transaction(["plants","meta"],"readwrite"),m=t.objectStore("meta"),pl=t.objectStore("plants");
 if(!isNew){pl.put(p)}else{var g=m.get("seq");g.onsuccess=function(){var n=(g.result?g.result.v:0)+1;m.put({k:"seq",v:n});p.no="EQ-"+String(n).padStart(4,"0");pl.put(p)}}
 t.oncomplete=function(){res(p)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function delPlant(id){return req("plants","readwrite",function(t){t.objectStore("plants").delete(id)})}
function getWishes(){return req("wishlist","readonly",function(t){return t.objectStore("wishlist").getAll()})}
function saveWish(w){return req("wishlist","readwrite",function(t){t.objectStore("wishlist").put(w)})}
function delWish(id){return req("wishlist","readwrite",function(t){t.objectStore("wishlist").delete(id)})}
function moveWish(w){return new Promise(function(res,rej){var t=DB.transaction(["plants","meta","wishlist"],"readwrite"),m=t.objectStore("meta"),g=m.get("seq"),no;
 g.onsuccess=function(){var n=(g.result?g.result.v:0)+1;no="EQ-"+String(n).padStart(4,"0");m.put({k:"seq",v:n});
  t.objectStore("plants").put({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:no,taxon:w.taxon,labelName:"",genus:w.genus||"",fieldNumber:w.fieldNumber||"",fieldNumberStatus:w.fieldNumber?(w.fieldNumberStatus||"Unknown"):"",locality:w.locality||"",localityStatus:w.localityStatus||"Unknown",source:w.source||"",acquired:"",notes:w.notes||"",created:Date.now(),updated:Date.now()});
  t.objectStore("wishlist").delete(w.id)};
 t.oncomplete=function(){res(no)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
async function reload(){plants=await getAll();wishes=await getWishes();genera=(await getMeta("genera"))||[];fns=await getFns();notes=await getNotes();photos=await getPhotos();buildPmap();lastBackup=await getMeta("lastBackup");lastFull=await getMeta("lastFull")}

var JA={"Acquisition Date":"入手日","Related Notes":"関連するメモ","Name (A–Z)":"名前順(A→Z・五十音)","Newest first":"新しい順(管理番号)","Oldest first":"古い順(管理番号)","By Field Number":"フィールドナンバー順","In Collection":"コレクション内の株","Edit":"編集","No prefix":"種別なし","Discard unsaved changes?":"保存していない変更を破棄しますか?","Discard":"破棄","Save backup file":"バックアップファイルを保存","Saved.":"保存しました。","This file is too large to save here.":"このファイルは大きすぎて、ここでは保存できません。","Saving was cancelled.":"保存をキャンセルしました。","Please wait a moment and try again.":"少し待ってから、もう一度お試しください。","Photos":"写真","+ Add Photos":"+ 写真を追加","No photos yet.":"写真はまだありません。","Photos are saved immediately and resized to 1600px.":"写真は追加した時点で保存され、長辺1600pxに縮小されます。","Close":"閉じる","◀ Move":"◀ 前へ","Move ▶":"後ろへ ▶","Set as first":"先頭にする","Delete this photo?":"この写真を削除しますか?","JSON Export (full, with photos)":"JSON書き出し(写真込みの完全版)","JSON Export (data only, no photos)":"JSON書き出し(データのみ・写真なし)","The data-only file is small and quick for everyday backups. Make a full backup with photos at least once a month.":"データのみの書き出しは軽く、普段のバックアップ向きです。写真込みの完全版も、月に1回以上は書き出してください。","Preparing photos…":"写真を書き出し中…","Delete this plant and its photos? Its Management Number will not be reused.":"この植物と写真を削除しますか?管理番号は再利用されません。","No matching plant.":"該当する植物がありません。","Choose a plant from the suggestions, or clear the field.":"候補から植物を選ぶか、欄を空にしてください。","New Note":"メモを追加","Edit Note":"メモを編集","Title (optional)":"タイトル(任意)","Date":"日付","Related Plant (optional)":"関連する植物(任意)","Note":"メモ","No notes yet. Tap + Add.":"まだメモがありません。「+ 追加」を押してください。","Please enter a title or a note.":"タイトルかメモを入力してください。","Delete this note?":"このメモを削除しますか?","All number types":"すべてのナンバー種別","New Field Number":"フィールドナンバーを追加","Edit Field Number":"フィールドナンバーを編集","Field Number *":"フィールドナンバー *","Verification Status":"確認状況","Prefix:":"ナンバー種別:","(from number)":"(番号から自動)","+ Add Field Number":"+ フィールドナンバーを追加","By Plant":"植物別","By Prefix":"種別別","← Back":"← 戻る","No Field Numbers yet. Tap + Add.":"まだ登録がありません。「+ 追加」を押してください。","Taxon / Plant Name and Field ing a file is not available here.":"この環境ではファイルを保存できません。","This backup was made by a newer version and cannot be restored.":"新しい版で作られたバックアップのため復元できません。","This file could not be read as a backup.":"このファイルはバックアップとして読み込めませんでした。","All data deleted.":"全データを削除しました。","Delete this plant? Its Management Number will not be reused.":"この植物を削除しますか?管理番号は再利用されません。","Delete ALL data on this device? Export a backup first. This cannot be undone.":"この端末の全データを削除しますか?先にバックアップを書き出してください。元に戻せません。"};
var PAT=[[/^Last backup was (\d+) days ago\.$/,"最終バックアップは$1日前です。"],[/^Replace ALL current data with this backup \((\d+) plants\)\?$/,"現在の全データをこのバックアップ($1件)で置き換えますか?"],[/^Restored (\d+) plants\.$/,"$1件を復元しました。"],[/^Prefixes: (\d+) · Field Numbers: (\d+)$/,"ナンバー種別: $1種類 · Field Number: $2件"],[/^No prefix · (\d+)$/,"種別なし · $1"],[/^Field Numbers: (\d+)$/,"Field Number: $1件"],[/^All genera \((\d+)\)$/,"すべての属($1)"],[/^Could not save the file \((.+)\)\.$/,"ファイルを保存できませんでした($1)。"],[/^Preparing photos (\d+) \/ (\d+)…$/,"写真を書き出し中 $1 / $2…"],[/^Backup file prepared, but (\d+) photo\(s\) could not be read and were skipped\.$/,"バックアップファイルを用意しましたが、$1枚の写真を読み込めず、含められませんでした。"],[/^Export failed: (.+)$/,"書き出しに失敗しました: $1"],[/^Processing (\d+) \/ (\d+)…$/,"処理中 $1 / $2…"],[/^(\d+) photo\(s\) could not be read\.$/,"$1枚の写真を読み込めませんでした。"],[/^Photos: (\d+) \((.+) MB\)$/,"写真: $1枚($2 MB)"],[/^Last photo backup: never$/,"写真込みの最終バックアップ: なし"],[/^Last photo backup: (.+)$/,"写真込みの最終バックアップ: $1"],[/^Notes: (\d+)$/,"メモ: $1件"],[/^Wishlist: (\d+)$/,"ウィッシュリスト: $1件"],[/^Plants: (\d+)$/,"植物数: $1"],[/^Last backup: (.+?) \((\d+) days ago\)$/,"最終バックアップ: $1($2日前)"],[/^Management Number: assigned on save$/,"管理番号: 保存時に自動で付きます"],[/^Management Number: (.+)$/,"管理番号: $1"],[/^Storage used: (.+?) MB(?: · Persistent: (yes|not granted))?$/,function(m,a,b){return "使用容量: "+a+" MB"+(b?" · 永続保存: "+(b==="yes"?"はい":"未許可"):"")}]];
var PH={"Management No., name or Field Number":"管理番号・植物名・Field Number","Search notes":"メモを検索","Plant, Field Number, Prefix, Locality":"植物名・Field Number・プレフィックス・産地","New genus name":"新しい属名","Search the wishlist":"ウィッシュリストを検索","Name, Genus, Field Number, Locality":"植物名・属名・Field Number・産地","e.g. GM437":"例: GM437","Type DELETE":"DELETE と入力"};
function tr(s){var k=s.trim();if(!k)return s;if(JA[k]!==undefined)return s.replace(k,function(){return JA[k]});for(var i=0;i<PAT.length;i++){if(PAT[i][0].test(k)){var o=k.replace(PAT[i][0],PAT[i][1]);return s.replace(k,function(){return o})}}return s}
function applyLang(){if(lang!=="ja")return;["main","nav","ov","pv"].forEach(function(id){var root=$(id),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,L=[];while((n=w.nextNode()))L.push(n);L.forEach(function(n){var p=n.parentNode;if(p.tagName==="TEXTAREA"||p.closest(".card"))return;n.nodeValue=tr(n.nodeValue)});Array.prototype.forEach.call(root.querySelectorAll("[placeholder]"),function(e){if(PH[e.placeholder])e.placeholder=PH[e.placeholder]})})}
function wishListHtml(){
 var s=wq.trim().toLowerCase();
 var l=wishes.filter(function(w){return !s||[w.taxon,w.genus,w.fieldNumber,w.locality].some(function(v){return String(v||"").toLowerCase().indexOf(s)>-1})});

 return l.map(function(w){return '<div class="card" data-id="'+esc(w.id)+'"><div class="tx">'+esc(w.taxon)+'</div><div class="sub">'+esc([w.fieldNumber,w.locality].filter(Boolean).join(" · "))+"</div></div>"}).join("")}
function wishView(){return "<h1>Wishlist <span class='muted'>("+wishes.length+")</span></h1>"+'<div class="top"><input id="wq" type="search" placeholder="Search the wishlist" value="'+esc(wq)+'"><button class="p" id="wadd">+ Add</button></div><div id="wlist">'+wishListHtml()+"</div>"}
function bindWish(){
 $("wq").oninput=function(e){wq=e.target.value;$("wlist").innerHTML=wishListHtml();applyLang()};

}
function wishForm(){

 function f(k){return esc(p[k])}
 return "<h1>"+(isNew?"New Wish":"Edit Wish")+"</h1>"+

function putMany(store,list){return req(store,"readwrite",function(t){var s=t.objectStore(store);list.forEach(function(x){s.put(x)})})}
async function syncPlantFn(p){
 if(!p.fieldNumber){p.fnId="";return}
 var f=(p.fnId&&fns.filter(function(x){return x.id===p.fnId})[0])||fns.filter(function(x){return fnNorm(x.fn)===fnNorm(p.fieldNumber)})[0];
 var other=fns.filter(function(x){return (!f||x.id!==f.id)&&fnNorm(x.fn)===fnNorm(p.fieldNumber)})[0];
 if(other)f=other;
 f=f?Object.assign({},f):{id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now()};
 f.fn=p.fieldNumber;f.prefix=fnPrefix(f.fn);
 if(p.taxon){f.taxon=p.taxon;f.genus=p.genus||f.genus||""}
 if(p.locality){f.locality=p.locality;f.status=p.localityStatus||"Unknown"}
 if(!f.status)f.status="Unknown";
 if(p.source)f.source=p.source;
 f.updated=Date.now();
 await saveFn(f);p.fnId=f.id;
 var i=fns.findIndex(function(x){return x.id===f.id});if(i<0)fns.push(f);else fns[i]=f}
async function reflectFn(f){
 var ch=plants.filter(function(p){return p.fnId===f.id||(!p.fnId&&p.fieldNumber&&fnNorm(p.fieldNumber)===fnNorm(f.fn))});if(!ch.length)return;
 ch.forEach(function(p){p.fnId=f.id;p.fieldNumber=f.fn;if(f.taxon){p.taxon=f.taxon;p.genus=f.genus||p.genus}p.locality=f.locality||"";p.localityStatus=f.status||"Unknown";p.source=f.source||"";p.updated=Date.now()});
 await putMany("plants",ch)}
async function unlinkFn(id){var ch=plants.filter(function(p){return p.fnId===id});if(!ch.length)return;ch.forEach(function(p){p.fnId=""});await putMany("plants",ch)}
async function migrateFns(){
 var ch=plants.filter(function(p){return p.fieldNumber&&(!p.fnId||!fns.some(function(f){return f.id===p.fnId}))});if(!ch.length)return;
 for(var i=0;i<ch.length;i++)await syncPlantFn(ch[i]);
 await putMany("plants",ch)}

var FK=["taxon","labelName","fieldNumber","fieldNumberStatus","locality","localityStatus","source","acquired","notes"];

async function storageInfo(){
 try{var s=await navigator.storage.estimate(),p=navigator.storage.persisted?await navigator.storage.persisted():null;
  $("sto").textContent="Storage used: "+(s.usage/1048576).toFixed(1)+" MB"+(p===null?"":" · Persistent: "+(p?"yes":"not granted"));applyLang()}catch(e){}}
async function saveFile(name,data){
 var blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(name)?"text/csv":"application/json"}),inClaude=typeof claude!=="undefined"&&claude&&claude.use,dl=null,err="";
 function fail(t){msg=t;render();return false}
 if(inClaude){try{dl=await claude.use("downloads")}catch(e){dl=null}}
 if(dl){try{await dl.save({filename:name,data:blob});return true}
  catch(e){var c=e&&e.code;if(c==="declined")return fail("Saving was cancelled.");if(c==="rate_limited")return fail("Please wait a moment and try again.");if(c==="too_large")return fail("This file is too large to save here.");err=c||(e&&e.message)||"error"}}
 try{var f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}
 catch(e){if(e&&e.name==="AbortError")return fail("Saving was cancelled.");err=err||(e&&e.name)||"error"}
 if(!inClaude){try{var u=URL.createObjectURL(blob),an=document.createElement("a");an.href=u;an.download=name;document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);return true}catch(e){err=err||"error"}}
 return fail("Could not save the file ("+(err||"unavailable")+").")}
async function savePending(){if(!pending)return;var pd=pending;
 if(await saveFile(pd.name,pd.blob)){var now=Date.now();lastBackup=now;await setMeta("lastBackup",now);if(pd.full&&!pd.skipped){lastFull=now;await setMeta("lastFull",now)}pending=null;msg="Saved.";render()}}
function restoreMsg(d){var c=function(x){return Array.isArray(x)?x.length:0},dt=d.exportedAt?new Date(d.exportedAt).toLocaleString():"?",keep=d.photosIncluded===false;
 if(lang==="ja")return "バックアップ("+dt+")\n植物 "+c(d.plants)+" · ウィッシュリスト "+c(d.wishlist)+" · Field Number "+c(d.fieldNumbers)+" · メモ "+c(d.notes)+"\n写真: "+(keep?"含まれていません(この端末の写真はそのまま残ります)":c(d.photos)+"枚")+"\n\n現在のデータをすべて、この内容に置き換えますか?";
 return "Backup from "+dt+"\nPlants "+c(d.plants)+" · Wishlist "+c(d.wishlist)+" · Field Numbers "+c(d.fieldNumbers)+" · Notes "+c(d.notes)+"\nPhotos: "+(keep?"not included (photos on this device are kept)":c(d.photos))+"\n\nReplace ALL current data with this backup?"}
function today(){return new Date().toISOString().slice(0,10)}
function csvq(s){s=String(s==null?"":s);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function bindSet(){
 if($("psave"))$("psave").onclick=savePending;
 $("ejson").onclick=async function(){
  exportJson(true)};
 $("ejson2").onclick=function(){exportJson(false)};
 $("ecsv").onclick=async function(){
  var cols=["no","genus"].concat(FK),rows=[cols].concat(plants.slice().sort(function(a,b){return a.no.localeCompare(b.no)}).map(function(p){return cols.map(function(k){return p[k]})}));
  await saveFile("eq-plants-"+today()+".csv","\ufeff"+rows.map(function(r){return r.map(csvq).join(",")}).join("\r\n"))};
 $("rest").onclick=function(){$("file").click()};
 $("file").onchange=async function(e){
  var f=e.target.files[0];if(!f)return;
  try{
   var d=JSON.parse(await f.text());
   if(d.app!=="EuphorbiaQuest Field Database"||!Array.isArray(d.plants))throw 0;
   if(d.schemaVersion>2){msg="This backup was made by a newer version and cannot be restored.";render();return}
   if(await ask(restoreMsg(d),"Restore")){
    var keepPhotos=d.photosIncluded===false,prs=[],pfs=[];
    if(!keepPhotos&&Array.isArray(d.photos)){for(var pi=0;pi<d.photos.length;pi++){var x=d.photos[pi];try{var fb=dataUrlToBuf(x.full),tb=x.thumb?dataUrlToBuf(x.thumb):fb;prs.push({id:x.id,plantId:x.plantId,order:x.order||0,w:x.w,h:x.h,created:x.created,thumb:tb,size:fb.byteLength+(x.thumb?tb.byteLength:0)});pfs.push({id:x.id,data:fb})}catch(pe){}}}
    var mx=d.plants.reduce(function(m,p){return Math.max(m,parseInt(String(p.no).replace(/\D/g,""),10)||0)},0);
    await new Promise(function(res,rej){var t=DB.transaction(["plants","meta","wishlist","fieldnos","notes","photos","photofull"],"readwrite"),s=t.objectStore("plants"),ws=t.objectStore("wishlist"),fs=t.objectStore("fieldnos"),ns=t.objectStore("notes");s.clear();ws.clear();fs.clear();ns.clear();if(!keepPhotos){var pst=t.objectStore("photos"),pft=t.objectStore("photofull");pst.clear();pft.clear();prs.forEach(function(x){pst.put(x)});pfs.forEach(function(x){pft.put(x)})}(Array.isArray(d.notes)?d.notes:[]).forEach(function(x){ns.put(x)});(Array.isArray(d.fieldNumbers)?d.fieldNumbers:[]).forEach(function(x){fs.put(x)});d.plants.forEach(function(p){s.put(p)});(Array.isArray(d.wishlist)?d.wishlist:[]).forEach(function(w){ws.put(w)});t.objectStore("meta").put({k:"seq",v:Math.max(d.seq||0,mx)});t.objectStore("meta").put({k:"genera",v:Array.isArray(d.genera)?d.genera:[]});t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}});
    dropUrls(Object.keys(turl));await reload();await migrateGenus();await fixPrefixes();await migrateFns();await cleanupOrphans();msg="Restored "+plants.length+" plants.";render()}
  }catch(err){msg="This file could not be read as a backup.";render()}
  e.target.value="";
 };
 $("wipe").onclick=async function(){
  if(await ask("Delete ALL data on this device? Export a backup first. This cannot be undone.","Delete All",true)){
   await new Promise(function(res,rej){var t=DB.transaction(["plants","meta","wishlist","fieldnos","notes","photos","photofull"],"readwrite");t.objectStore("photos").clear();t.objectStore("photofull").clear();t.objectStore("notes").clear();t.objectStore("plants").clear();t.objectStore("wishlist").clear();t.objectStore("fieldnos").clear();t.objectStore("meta").clear();t.oncomplete=res;t.onerror=function(){rej(t.error)}});
   dropUrls(Object.keys(turl));await reload();msg="All data deleted.";render()}};
}

(async function(){
 try{DB=await openDB();await reload();lang=(await getMeta("lang"))||"en";csort=(await getMeta("csort"))||"name";await migrateGenus();await fixPrefixes();await migrateFns();await migratePhotos();await cleanupOrphans();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
 catch(e){$("main").innerHTML="<h1>Storage unavailable</h1><p class='muted'>This browser did not allow local storage. Try opening the page in Safari without Private Browsing.</p>";return}
 render();
})();
})();
