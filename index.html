<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>EuphorbiaQuest Field Database</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ec;--surface:#fff;--text:#1c261c;--muted:#68725f;--line:#d9d5c7;--accent:#3d6838;--accent-t:#fff;--danger:#b3392f;--warn:#fbf0d4;--warn-t:#6b4e00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141914;--surface:#1d241d;--text:#e8ece4;--muted:#9aa595;--line:#324030;--accent:#7fb877;--accent-t:#101810;--danger:#e0736a;--warn:#3a3217;--warn-t:#e6cf8a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141914;--surface:#1d241d;--text:#e8ece4;--muted:#9aa595;--line:#324030;--accent:#7fb877;--accent-t:#101810;--danger:#e0736a;--warn:#3a3217;--warn-t:#e6cf8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px 14px 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:21px;margin:0 0 10px}
h2{font-size:15px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea,button{font:inherit;font-size:17px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input,select,textarea{width:100%}
button{cursor:pointer}
button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.d{color:var(--danger)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .no{font-size:13px;font-weight:700;color:var(--accent)}
.card .tx{font-weight:600;font-style:italic}
.card .sub{font-size:14px;color:var(--muted)}
.banner{background:var(--warn);color:var(--warn-t);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.top{display:flex;gap:8px;margin:10px 0}.top input{flex:1}
.muted{color:var(--muted);font-size:14px}
.stack>*{margin-bottom:8px;width:100%}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:4px;overflow:hidden}.sug:empty{display:none}.sug div{padding:12px 14px;font-style:italic;border-bottom:1px solid var(--line);cursor:pointer}.sug div:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;line-height:1.2;padding:9px 2px;min-height:56px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700}
.cp{display:flex;gap:12px;align-items:center}.cp .cb{flex:1;min-width:0}.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line);flex:none;display:block}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:pointer;background:var(--line)}
#pv{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}#pv.on{display:flex}#pv img{flex:1;min-height:0;width:100%;object-fit:contain}
#pv .pvt,#pv .bar{display:flex;gap:6px;align-items:center;padding:10px;background:#000;color:#fff}#pv .pvt{padding-top:calc(10px + env(safe-area-inset-top,0px))}#pv .bar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#pv button{background:#222;color:#fff;border-color:#444;font-size:15px;padding:8px 6px}#pv .bar button{flex:1}#pv .pvt button{min-width:52px}#pv button:disabled{opacity:.35}#pv #pv_n{flex:1;text-align:center;font-size:14px;color:#ccc}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;padding:20px;align-items:center;justify-content:center}
#ov.on{display:flex}
#ovm{white-space:pre-line}
.card.off{opacity:.6}.seg{display:flex;margin:6px 0 10px}.seg button{flex:1;border-radius:0;font-size:15px;min-height:40px;padding:6px 8px}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}.ck{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;margin:12px 0 0}.ck input{width:22px;height:22px;min-height:0;flex:none;margin:0}button:disabled{opacity:.55}
.tag.hi{color:var(--danger);border-color:var(--danger)}.seen{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--surface)}.seen .row{margin-top:6px}.sl{padding:8px 0;border-top:1px solid var(--line)}.sl:first-child{border-top:0}.sl a{color:var(--accent);word-break:break-all}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--muted);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin-top:14px}.dl{padding:10px 0;border-bottom:1px solid var(--line)}.dl:last-child{border-bottom:0}.dk{font-size:13px;color:var(--muted)}.dv{font-size:17px}.dv.pre{white-space:pre-wrap}
.grp{margin-bottom:8px}.gh{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:54px;text-align:left}.gc{color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}.gb{margin:8px 0 4px 12px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);margin:-6px -14px 6px;padding:8px 14px}
.hdr button{min-height:40px;font-size:15px;padding:6px 14px}#topback{font-weight:600}
#ov .box{background:var(--bg);border-radius:14px;padding:18px;max-width:420px;width:100%}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"></nav>
<div id="ov"><div class="box"><div id="ovm"></div><input id="ovi" style="display:none;margin-top:10px" placeholder="Type DELETE"><div class="row" style="margin-top:14px"><button id="ovc">Cancel</button><button id="ovo" class="p">OK</button></div></div></div>
<div id="pv"><div class="pvt"><button id="pv_x">Close</button><span id="pv_n"></span><button id="pv_p">‹</button><button id="pv_nx">›</button></div><img id="pv_img" alt=""><div class="bar"><button id="pv_l">◀ Move</button><button id="pv_r">Move ▶</button><button id="pv_f">Set as first</button><button id="pv_d" style="color:#ff9b93">Delete</button></div></div>
<script>
(function(){
var DB,plants=[],lastBackup=null,tab="collection",q="",editing=null,msg="",lang="en",wishes=[],wq="",wgf="",wsort="pri",wedit=null,genera=[],gf="",fns=[],fq="",fmode="plant",fpre="",ftax=null,fedit=null,fdef={},notes=[],nq="",nedit=null,lastFull=null,pending=null,fview=null,csort="name",pview=null,vstack=[],wview=null,nview=null,dirty=0,pdirty=0,quiet=true,mprefix="EQ",sf="growing",xf="";
var APP_VERSION="1.5.3",APP_DATE="2026-11-16";
function touch(n){if(quiet)return;dirty+=(n||1);setMeta("dirty",dirty).catch(function(){})}
function touchP(n){if(quiet)return;pdirty+=(n||1);setMeta("pdirty",pdirty).catch(function(){})}
var ST=["Unknown","Confirmed"];
var TABS=[["collection","Collection"],["wishlist","Wishlist"],["fields","Field Numbers"],["notes","Notes"],["settings","Settings / Backup"]];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML.replace(/"/g,"&quot;")}
function opts(sel){return ST.map(function(s){return "<option value=\""+s+"\""+(s===sel?" selected":"")+">"+s+"</option>"}).join("")}

function openDB(){return new Promise(function(res,rej){var r=indexedDB.open("eq-field-db",7);
 r.onupgradeneeded=function(){var d=r.result;var n=d.objectStoreNames;if(!n.contains("plants"))d.createObjectStore("plants",{keyPath:"id"});if(!n.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});if(!n.contains("wishlist"))d.createObjectStore("wishlist",{keyPath:"id"});if(!n.contains("fieldnos"))d.createObjectStore("fieldnos",{keyPath:"id"});if(!n.contains("notes"))d.createObjectStore("notes",{keyPath:"id"});if(!n.contains("photos"))d.createObjectStore("photos",{keyPath:"id"});if(!n.contains("photofull"))d.createObjectStore("photofull",{keyPath:"id"});if(!n.contains("shared"))d.createObjectStore("shared",{keyPath:"id"})};
 r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function req(store,mode,fn){return new Promise(function(res,rej){var t=DB.transaction(store,mode),o=fn(t);t.oncomplete=function(){res(o&&o.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function getAll(){return req("plants","readonly",function(t){return t.objectStore("plants").getAll()})}
function getMeta(k){return req("meta","readonly",function(t){return t.objectStore("meta").get(k)}).then(function(r){return r?r.v:null})}
function setMeta(k,v){return req("meta","readwrite",function(t){t.objectStore("meta").put({k:k,v:v})})}
function savePlant(p,isNew){return new Promise(function(res,rej){
 var t=DB.transaction(["plants","meta"],"readwrite"),m=t.objectStore("meta"),pl=t.objectStore("plants");
 if(!isNew){pl.put(p)}else{var g=m.get("seq");g.onsuccess=function(){var n=(g.result?g.result.v:0)+1;m.put({k:"seq",v:n});p.no=mprefix+"-"+String(n).padStart(4,"0");pl.put(p)}}
 t.oncomplete=function(){res(p)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function delPlant(id){return req("plants","readwrite",function(t){t.objectStore("plants").delete(id)})}
function getWishes(){return req("wishlist","readonly",function(t){return t.objectStore("wishlist").getAll()})}
function saveWish(w){return req("wishlist","readwrite",function(t){t.objectStore("wishlist").put(w)})}
function delWish(id){return req("wishlist","readwrite",function(t){t.objectStore("wishlist").delete(id)})}
function moveWish(w){var npId="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);return new Promise(function(res,rej){var t=DB.transaction(["plants","meta","wishlist","photos"],"readwrite"),m=t.objectStore("meta"),g=m.get("seq"),no;
 g.onsuccess=function(){var n=(g.result?g.result.v:0)+1;no=mprefix+"-"+String(n).padStart(4,"0");m.put({k:"seq",v:n});
  t.objectStore("plants").put({id:npId,no:no,taxon:w.taxon,labelName:"",genus:w.genus||"",fieldNumber:w.fieldNumber||"",fieldNumberStatus:w.fieldNumber?(w.fieldNumberStatus||"Unknown"):"",locality:w.locality||"",localityStatus:w.localityStatus||"Unknown",source:w.source||"",acquired:"",notes:w.notes||"",created:Date.now(),updated:Date.now()});
  var ps=t.objectStore("photos");photos.forEach(function(r){if(r.plantId===w.id)ps.put(Object.assign({},r,{plantId:npId}))});
  t.objectStore("wishlist").delete(w.id)};
 t.oncomplete=function(){res(no)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
async function reload(){plants=await getAll();wishes=await getWishes();await reloadShared();genera=(await getMeta("genera"))||[];fns=await getFns();notes=await getNotes();photos=await getPhotos();buildPmap();lastBackup=await getMeta("lastBackup");lastFull=await getMeta("lastFull");dirty=(await getMeta("dirty"))||0;pdirty=(await getMeta("pdirty"))||0;mprefix=(await getMeta("prefix"))||"EQ"}

var JA={"Status":"状態","Status Date (optional)":"状態の日付(任意)","Growing":"栽培中","Dead":"枯死","Given away":"譲渡","Growing only":"栽培中のみ","All statuses":"すべての状態","No filter":"絞り込みなし","Locality: unknown":"産地: 不明","Locality: confirmed":"産地: 確認済み","No locality":"産地の記入なし","No photos":"写真なし","With photos":"写真あり","No Field Number":"Field Numberなし","With Field Number":"Field Numberあり","No details yet.":"まだ詳細がありません。","Import":"取り込み","CSV Import (add plants)":"CSV取り込み(株を追加)","CSV import only adds plants. It never changes or deletes existing ones.":"CSV取り込みは、株を追加するだけです。すでにある株を書き換えたり、消したりはしません。","The first row must be column names: taxon, fieldNumber, locality, source, acquired, notes (or 学名, 産地, 入手先, 入手日, 備考). Rows whose management number already exists are skipped.":"1行目は列の名前にしてください: taxon, fieldNumber, locality, source, acquired, notes(または 学名, 産地, 入手先, 入手日, 備考)。管理番号がすでにある行は飛ばします。","With many photos, the full backup is split into several files. Save every file. To restore, import file 1 first, then the others.":"写真が多いと、完全版は複数のファイルに分かれます。すべてのファイルを保存してください。復元するときは、ファイル1を先に読み込み、続けて残りを読み込みます。","Management Number":"管理番号","Prefix for new numbers":"新しい番号の頭文字","Use 1 to 8 letters or digits for the prefix.":"頭文字は、英数字1〜8文字で入力してください。","Prefix saved.":"頭文字を保存しました。","This CSV has no data rows.":"このCSVにはデータの行がありません。","No plant-name column was found. The first row must contain a column name such as taxon or 学名.":"植物名の列が見つかりませんでした。1行目に taxon や 学名 などの列名を入れてください。","This CSV file could not be read.":"このCSVファイルを読み込めませんでした。","Add":"追加","Open":"開く","Delete this plant and its photos? Its Management Number will not be reused.\n\nTo keep the record instead, change Status to Dead or Given away.":"この植物と写真を削除しますか?管理番号は再利用されません。\n\n記録を残したい場合は、削除せずに「状態」を枯死や譲渡に変えてください。","Acquisition Date":"入手日","Related Notes":"関連するメモ","Name (A–Z)":"名前順(A→Z・五十音)","Newest first":"新しい順(管理番号)","Oldest first":"古い順(管理番号)","By Field Number":"フィールドナンバー順","In Collection":"コレクション内の株","Edit":"編集","No prefix":"種別なし","Discard unsaved changes?"   var q=lang==="ja"?sender+" のリスト("+d.items.length+"件)を受け取りますか?\n\n「受け取ったリスト」に保存され、自分のウィッシュリストには入りません。"+(old?"\n\nこの人から前に受け取ったリストは、新しいものに入れ替わります。":"")
   :"Receive "+sender+"'s list ("+d.items.length+" plants)?\n\nIt is stored under Received and does not go into your own Wishlist."+(old?"\n\nThe list you received from this person before will be replaced.":"");
  if(!(await ask(q,"Receive")))return;
  var items=d.items.slice(0,5000).map(function(x){x=x||{};var pr=PRK[x.priority]!==undefined?x.priority:"mid",ph=[];
   (Array.isArray(x.photos)?x.photos:[]).slice(0,SHMAX).forEach(function(u){try{ph.push(dataUrlToBuf(u))}catch(e){}});
   var o={taxon:str(x.taxon,300),genus:str(x.genus,80),priority:pr,fieldNumber:str(x.fieldNumber,80),fieldNumberStatus:str(x.fieldNumberStatus,20),locality:str(x.locality),localityStatus:str(x.localityStatus,20),source:str(x.source),notes:str(x.notes,5000),photos:ph};
   if(Array.isArray(x.seen))o.seen=x.seen.slice(0,100).map(function(s){s=s||{};return {d:str(s.d,20),w:str(s.w,300),p:str(s.p,100),u:str(s.u,1000)}});
   return o}).filter(function(o){return o.taxon});
  await putShared({id:id,sender:sender,sentAt:str(d.sentAt,40),received:Date.now(),items:items});touch();await reloadShared();
  tab="wishlist";wtab="recv";editing=wedit=fedit=nedit=null;wshare=false;vstack=[{t:"r",id:id}];

 }catch(e){msg="This file could not be read.";render()}}

 return '<select id="gf"><option value="">All genera ('+B.length+')</option>'+L.map(function(g){return '<option value="'+esc(g)+'"'+(g===gf?" selected":"")+">"+esc(g)+" ("+cnt[g]+")</option>"}).join("")+"</select>"}
function genusOf(t){var a=String(t||"").trim().split(/\s+/);if(a[0]==="×"||a[0]==="x"||a[0]==="X")a.shift();var g=(a[0]||"").replace(/^×/,"");if(!/^[A-Za-z][A-Za-z\-]*$/.test(g))return "";return g.charAt(0).toUpperCase()+g.slice(1).toLowerCase()}

async function migrateGenus(){var ch=[];plants.forEach(function(p){if(!p.genus){var g=genusOf(p.taxon);if(g){p.genus=g;ch.push(["plants",p])}}});wishes.forEach(function(w){if(!w.genus){var g=genusOf(w.taxon);if(g){w.genus=g;ch.push(["wishlist",w])}}});
 if(!ch.length)return;await new Promise(function(res,rej){var t=DB.transaction(["plants","wishlist"],"readwrite");ch.forEach(function(c){t.objectStore(c[0]).put(c[1])});t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}

function fnKey(t){return String(t||"").trim().toLowerCase()}

function fnPrefix(s){var m=String(s||"").trim().match(/^([^\d]*)/),p=m?m[1].replace(/[\s\-_.#:]+$/,"").trim():"";return /^[A-Za-z]/.test(p)?p.toUpperCase():""}

  xp={chunks:photoChunks(),i:0,skipped:0,done:0,seq:seq,bid:bid,stamp:today()};pending=null;await prepPart();
 }catch(e){msg="Export failed: "+(e&&e.message?e.message:String(e));render()}}

 try{var n=xp.chunks.length,i=xp.i,list=xp.chunks[i],total=photos.length;
  var head=i===0?backupHead(true,xp.seq,n,xp.bid):'{\n "app": "EuphorbiaQuest Field Database",\n "schemaVersion": 2,\n "kind": "photos-part",\n "backupId": '+JSON.stringify(xp.bid)+',\n "part": '+(i+1)+',\n "of": '+n+',\n "exportedAt": '+JSON.stringify(new Date().toISOString())+',\n "photos": [';
  var parts=[head],k=0;
  if(list.length){msg="Preparing photos "+xp.done+" / "+total+"…";render()}
  for(var j=0;j<list.length;j++){var r=list[j];xp.done++;var bn=document.querySelector(".banner");if(bn){bn.textContent="Preparing photos "+xp.done+" / "+total+"…";applyLang()}

  parts.push("\n ]\n}");
  setPending({name:"eq-backup-"+xp.stamp+"-full"+(n>1?"-"+(i+1)+"of"+n:"")+".json",blob:new Blob(parts,{type:"application/json"}),skipped:xp.skipped,full:true,part:i+1,of:n});
 }catch(e){msg="Export failed: "+(e&&e.message?e.message:String(e));render()}}

async function restoreFile(f){

  var mx=d.plants.reduce(function(m,p){return Math.max(m,parseInt(String(p.no).replace(/\D/g,""),10)||0)},0);

   s.clear();ws.clear();fs.clear();ns.clear();
   if(!keepPhotos){var pst=t.objectStore("photos"),pft=t.objectStore("photofull");pst.clear();pft.clear();prs.forEach(function(x){pst.put(x)});pfs.forEach(function(x){pft.put(x)});mt.put({k:"pdirty",v:0})}
   (Array.isArray(d.notes)?d.notes:[]).forEach(function(x){ns.put(x)});(Array.isArray(d.fieldNumbers)?d.fieldNumbers:[]).forEach(function(x){fs.put(x)});d.plants.forEach(function(p){s.put(p)});(Array.isArray(d.wishlist)?d.wishlist:[]).forEach(function(w){ws.put(w)});
   if(Array.isArray(d.sharedLists)){var shs=t.objectStore("shared");shs.clear();sharedFromJson(d.sharedLists).forEach(function(x){shs.put(x)})}
   mt.put({k:"seq",v:Math.max(d.seq||0,mx)});mt.put({k:"genera",v:Array.isArray(d.genera)?d.genera:[]});mt.put({k:"dirty",v:0});
   if(d.settings&&/^[A-Za-z0-9]{1,8}$/.test(d.settings.prefix||""))mt.put({k:"prefix",v:d.settings.prefix});
   t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}});
  dropUrls(Object.keys(turl));quiet=true;await reload();await migrateGenus();await fixPrefixes();await migrateFns();await cleanupOrphans();quiet=false;
  msg=(lang==="ja"?plants.length+"件を復元しました。":"Restored "+plants.length+" plants.")+(!keepPhotos&&d.photoParts>1?(lang==="ja"?"このバックアップの写真は全"+d.photoParts+"ファイルです。続けて、同じボタンでファイル2〜"+d.photoParts+"を読み込んでください。":" This backup has "+d.photoParts+" photo files. Import files 2 to "+d.photoParts+" next, with the same button."):"");render();

var CSVMAP={no:["no","managementnumber","managementno","管理番号","番号"],taxon:["taxon","plantname","taxonplantname","name","species","scientificname","学名","植物名","種名","名前","品種名"],genus:["genus","属","属名"],labelName:["labelname","label","labelnameatacquisition","ラベル名","ラベル","入手時のラベル名"],fieldNumber:["fieldnumber","fn","fieldno","フィールドナンバー"],fieldNumberStatus:["fieldnumberstatus"],locality:["locality","location","産地","採集地","ロカリティ"],localityStatus:["localitystatus"],source:["source","provenance","sourceprovenance","入手先","由来","出典","入手元","購入先"],acquired:["acquired","acquisitiondate","date","入手日","購入日","導入日"],notes:["notes","note","memo","remarks","備考","メモ"],state:["state","status","状態"],stateDate:["statedate","statusdate","状態の日付"]};
function normH(h){return String(h||"").toLowerCase().replace(/[\s_\-\/()()・.]/g,"")}
function pad2(v){return String(v).padStart(2,"0")}
function normDate(v){var m=String(v||"").trim().match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);return m?m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]):""}
function parseCsv(text){text=String(text).replace(/^﻿/,"");var first=text.split(/\r?\n/)[0]||"",d=first.split("\t").length>first.split(",").length?"\t":",",rows=[],row=[],cur="",inq=false;
 for(var i=0;i<text.length;i++){var c=text[i];
  if(inq){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=c}
  else if(c==='"'&&cur==="")inq=true;
  else if(c===d){row.push(cur);cur=""}
  else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
  else if(c!=="\r")cur+=c}
 if(cur!==""||row.length){row.push(cur);rows.push(row)}
 return rows.filter(function(r){return r.some(function(v){return String(v).trim()!==""})})}
async function readTextSmart(file){var buf=await file.arrayBuffer();try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder("shift_jis").decode(buf)}catch(e2){return new TextDecoder("utf-8").decode(buf)}}}
async function importCsv(file){
 try{
  var rows=parseCsv(await readTextSmart(file));if(rows.length<2){msg="This CSV has no data rows.";render();return}
  var H=rows[0].map(normH),col={};Object.keys(CSVMAP).forEach(function(k){for(var j=0;j<CSVMAP[k].length;j++){var i=H.indexOf(normH(CSVMAP[k][j]));if(i>-1){col[k]=i;break}}});
  if(col.taxon===undefined&&col.genus===undefined){msg="No plant-name column was found. The first row must contain a column name such as taxon or 学名.";render();return}
  var have={};plants.forEach(function(p){have[String(p.no).toLowerCase()]=1});var add=[],dup=0,blank=0;
  rows.slice(1).forEach(function(r){var g=function(k){return col[k]===undefined?"":String(r[col[k]]==null?"":r[col[k]]).trim()};
   var taxon=g("taxon"),genus=g("genus");if(genus&&taxon&&taxon.toLowerCase().indexOf(genus.toLowerCase())!==0)taxon=genus+" "+taxon;if(!taxon)taxon=genus;if(!taxon){blank++;return}
   var no=g("no");if(no){if(have[no.toLowerCase()]){dup++;return}have[no.toLowerCase()]=1}
   var acq=g("acquired"),date=normDate(acq),nt=g("notes");if(acq&&!date)nt=(nt?nt+"\n":"")+"Acquired: "+acq;
   var sv=g("state"),state=/dead|枯/i.test(sv)?"dead":/given|transfer|sold|譲|売/i.test(sv)?"given":"growing",fnv=g("fieldNumber"),isC=function(v){return /confirm|確認済/i.test(v)};
   add.push({no:no,taxon:taxon,labelName:g("labelName"),fieldNumber:fnv,fieldNumberStatus:fnv?(isC(g("fieldNumberStatus"))?"Confirmed":"Unknown"):"",locality:g("locality"),localityStatus:isC(g("localityStatus"))?"Confirmed":"Unknown",source:g("source"),acquired:date,state:state,stateDate:state==="growing"?"":normDate(g("stateDate")),notes:nt})});
  if(!add.length){msg=lang==="ja"?"追加できる行がありませんでした(管理番号が重複: "+dup+"行、植物名なし: "+blank+"行)。":"There were no rows to add (duplicate number: "+dup+", no plant name: "+blank+").";render();return}
  var cols=Object.keys(col).join(", ");
  var text=lang==="ja"?"CSVの内容\n追加する株: "+add.length+"\n飛ばす行(管理番号がすでにある): "+dup+"\n飛ばす行(植物名がない): "+blank+"\n読み取った列: "+cols+"\n\nコレクションに"+add.length+"株を追加しますか?"
   :"CSV contents\nPlants to add: "+add.length+"\nSkipped (number already exists): "+dup+"\nSkipped (no plant name): "+blank+"\nColumns found: "+cols+"\n\nAdd "+add.length+" plants to Collection?";
  if(!(await ask(text,"Add")))return;
  var re=new RegExp("^"+mprefix.replace(/[^A-Za-z0-9]/g,"")+"-(\\d+)$","i"),mxn=0;plants.concat(add).forEach(function(p){var m=String(p.no||"").match(re);if(m)mxn=Math.max(mxn,parseInt(m[1],10))});
  await new Promise(function(res,rej){var t=DB.transaction(["plants","meta"],"readwrite"),mt=t.objectStore("meta"),pl=t.objectStore("plants"),g=mt.get("seq");
   g.onsuccess=function(){var n=Math.max(g.result?g.result.v:0,mxn),now=Date.now();
    add.forEach(function(a,i){if(!a.no){do{n++;a.no=mprefix+"-"+String(n).padStart(4,"0")}while(have[a.no.toLowerCase()]);have[a.no.toLowerCase()]=1}
     a.id="p"+now.toString(36)+i.toString(36)+Math.random().toString(36).slice(2,6);a.genus=genusOf(a.taxon);a.created=now+i;a.updated=now;pl.put(a)});
    mt.put({k:"seq",v:n})};
   t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}});
  touch(add.length);quiet=true;await reload();await migrateGenus();await migrateFns();quiet=false;

 }catch(e){msg="This CSV file could not be read.";render()}}
